<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1236" />
      <stop offset="100%" stop-color="#090a22" />
    </radialGradient>

    <!-- Orange Gradient (Top arc) -->
    <linearGradient id="fav-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA200" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#EA3A00" />
    </linearGradient>

    <!-- Cyan/Blue Gradient (Bottom-Left arc) -->
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Purple/Violet Gradient (Bottom-Right arc) -->
    <linearGradient id="fav-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="120" height="120" rx="30" fill="url(#fav-bg)" stroke="#5a3c8e" stroke-width="2" />

  <!-- Tri-color interconnected mobius loop -->
  <g filter="url(#glow)">
    <!-- Top Orange Arc -->
    <path
      d="M38 42 C44 26 76 26 82 42 C87 54 78 68 66 66 C56 64 54 52 60 44"
      stroke="url(#fav-orange)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bottom-Left Cyan Arc -->
    <path
      d="M36 50 C26 68 38 94 56 94 C68 94 76 82 72 70 C68 58 56 58 48 66"
      stroke="url(#fav-cyan)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bottom-Right Purple Arc -->
    <path
      d="M74 48 C88 64 80 92 62 92 C50 92 44 80 50 68 C54 58 68 56 74 64"
      stroke="url(#fav-purple)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
